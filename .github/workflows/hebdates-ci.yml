name: hebdates CI
on:
  push:
    paths: ['hebdates/**', '.github/workflows/hebdates-ci.yml']
  pull_request:
    paths: ['hebdates/**', '.github/workflows/hebdates-ci.yml']
permissions: { contents: read }
defaults:
  run: { working-directory: hebdates }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
